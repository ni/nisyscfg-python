[project]
name = "nisyscfg"
version = "0.2.1"
description = "NI System Configuration Python API"
readme = "README.md"
requires-python = '>=3.11,<4.0'
license = "MIT"
authors = [{ name = "National Instruments" }]
maintainers = [{ name = "Tyler Krehbiel", email = "tyler.krehbiel@emerson.com" }]
keywords = ["nisyscfg", "syscfg"]
dynamic = ["dependencies"]
classifiers = [
	"Development Status :: 1 - Planning",
	"Intended Audience :: Developers",
	"Intended Audience :: Manufacturing",
	"Intended Audience :: Science/Research",
	"License :: OSI Approved :: MIT License",
	"Operating System :: Microsoft :: Windows",
	"Operating System :: POSIX",
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
	"Programming Language :: Python :: 3.13",
	"Programming Language :: Python :: 3.14",
	"Programming Language :: Python :: 3.15",
	"Programming Language :: Python :: Implementation :: CPython",
	"Topic :: System :: Hardware :: Hardware Drivers",
]
[project.urls]
repository = "https://github.com/ni/nisyscfg-python"
changelog = "https://github.com/ni/nisyscfg-python/blob/main/CHANGELOG.md"

[build-system]
requires = ["poetry-core>=2.1.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
requires-poetry = '>=2.1,<3.0'
packages = [{ include = "nisyscfg", from = "src" }]

[tool.poetry.dependencies]
hightime = "1.0.0"

[tool.poetry.group.test.dependencies]
pytest = ">=7.2"
pytest-cov = ">=4.0"

[tool.poetry.group.lint.dependencies]
ni-python-styleguide = ">=0.5.1"
mypy = ">=2.4,<3.0"
pyright = { version = ">=1.1.414,<2.0", extras = ["nodejs"] }
bandit = ">=1.9.4,<2.0"

[tool.pytest.ini_options]
addopts = "--cov=nisyscfg --cov-report=term --cov-report=xml --cov-report=html -svv --strict-markers"
testpaths = ["tests"]

[tool.ni-python-styleguide]
application-import-names = "nisyscfg,tests"
extend_exclude = ".tox,docs,build,__pycache__,.venv*,generated,src/nisyscfg/_library.py"

[tool.black]
line-length = 100

[tool.bandit]
skips = [
  "B101", # assert_used
]


[tool.mypy]
files = "examples/,src/,tests/"
namespace_packages = true
strict = true


[tool.pyright]
include = [
    "src",
    "examples",
    "tests"
]