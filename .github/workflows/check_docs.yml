name: Check docs

on:
  workflow_call:
    inputs:
      package-name:
        description: 'The name of the package folder to check.'
        default: ''
        required: true
        type: string
      package-basepath:
        description: 'The base path of the package to check, relative to the repo root.'
        default: ''
        required: true
        type: string
      check-docs:
        description: 'Whether to check documentation generation.'
        default: 'true'
        type: string

permissions: {}

jobs:
  no_op:
    if: ${{ inputs.check-docs == 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: No-Op
        run: echo "Not checking docs for ${PACKAGE_NAME} because check-docs is set to false."
        env:
          PACKAGE_NAME: ${{ inputs.package-name }}
  check_docs:
    name: Check docs for ${{ inputs.package-name }}
    if: ${{ inputs.check-docs == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        # Set the working-directory for all steps in this job.
        working-directory: ${{ inputs.package-basepath }}
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: ni/python-actions/setup-python@dee640bba235ae28fdc6b7337c643bd06358ae90 # v0.9.0
        id: setup-python
      - name: Set up Poetry
        uses: ni/python-actions/setup-poetry@dee640bba235ae28fdc6b7337c643bd06358ae90 # v0.9.0
      - name: Check for lock changes
        run: poetry check --lock
      - name: Cache virtualenv (with docs)
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ github.workspace }}/${{ needs.get_package_info.outputs.package-basepath == '.' && '.venv' || format('{0}/.venv', needs.get_package_info.outputs.package-basepath) }}
          key:  ${{ inputs.package-name }}-${{ matrix.os }}-py${{ matrix.python-version }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}
      - name: Install ${{ inputs.package-name }} (with docs)
        run: poetry install -v --only main,docs
      - name: Generate docs
        run:  poetry run sphinx-build docs docs/_build -b html -W
      # TODO: remove uploading this artifact once publishing to RTD is setup
      - name: Upload docs artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: ${{ inputs.package-name }}-docs
          path: ${{ inputs.package-basepath }}/docs/_build/
