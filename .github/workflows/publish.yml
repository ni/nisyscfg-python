name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      environment:
        description: The environment to publish to.
        default: 'none'
        required: true
        type: choice
        options:
          - none
          - pypi
          - testpypi
      package-name:
        description: The name of the package to publish.
        default: 'none'
        required: true
        type: choice
        options:
          - none
          - nisyscfg

permissions: {}

env:
  environment: ${{ case(github.event_name == 'release', 'pypi', inputs.environment) }}
  environment-info: |
    {
      "pypi": {
        "base-url": "https://pypi.org",
        "upload-url": "https://upload.pypi.org/legacy/"
      },
      "testpypi": {
        "base-url": "https://test.pypi.org",
        "upload-url": "https://test.pypi.org/legacy/"
      }
    }

jobs:
  get_publish_info:
    name: Get publish info
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      package-name: ${{ steps.get_package_name_and_version.outputs.package-name }}
      package-version: ${{ steps.get_package_name_and_version.outputs.package-version }}
    steps:
      - name: Get package name and package version
        id: get_package_name_and_version
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_PACKAGE_NAME: ${{ inputs.package-name }}
        run: |
          if [ "$EVENT_NAME" = "release" ]; then
            if [[ ! "$EVENT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Invalid release tag '$EVENT_TAG'. Expected format: v<major>.<minor>.<patch>"
              exit 1
            fi

            echo "package-name=nisyscfg" >> "$GITHUB_OUTPUT"
            echo "package-version=${EVENT_TAG#v}" >> "$GITHUB_OUTPUT"
          else
            echo "package-name=$INPUT_PACKAGE_NAME" >> "$GITHUB_OUTPUT"
            echo "package-version=unused" >> "$GITHUB_OUTPUT"
          fi
  get_package_info:
    name: Get package info for ${{ needs.get_publish_info.outputs.package-name }}
    if: ${{ github.event_name == 'release' || inputs.package-name != 'none' }}
    uses: ./.github/workflows/get_package_info.yml
    needs: get_publish_info
    permissions:
      contents: read
    with:
      package-name: ${{ needs.get_publish_info.outputs.package-name }}
  analyze_package:
    name: Analyze package for ${{ needs.get_publish_info.outputs.package-name }}
    if: ${{ github.event_name == 'release' || inputs.package-name != 'none' }}
    uses: ./.github/workflows/analyze_package.yml
    needs: [get_publish_info, get_package_info]
    with:
      package-name: ${{ needs.get_publish_info.outputs.package-name }}
      package-basepath: ${{ needs.get_package_info.outputs.package-basepath }}
      install-extras: ${{ needs.get_package_info.outputs.install-extras }}
  # TODO: Call check docs post including check docs file which generates docs.
  build_package:
    name: Build ${{ needs.get_publish_info.outputs.package-name }}
    if: ${{ github.event_name == 'release' || inputs.package-name != 'none' }}
    runs-on: ubuntu-latest
    needs: [get_publish_info, get_package_info, analyze_package] # TODO: Add check docs to needs
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: ni/python-actions/setup-python@edaf1454897cb4cd5f6fc0757cb62dee455e57fd # v0.10.1
      - name: Set up Poetry
        uses: ni/python-actions/setup-poetry@edaf1454897cb4cd5f6fc0757cb62dee455e57fd # v0.10.1
        with:
          use-cache: false
      - name: Check project version
        if: github.event_name == 'release'
        uses: ni/python-actions/check-project-version@edaf1454897cb4cd5f6fc0757cb62dee455e57fd # v0.10.1
        with:
          project-directory: ${{ github.workspace }}/${{ needs.get_package_info.outputs.package-basepath }}
          expected-version: ${{ needs.get_publish_info.outputs.package-version }}
      - name: Build distribution packages
        run: poetry build
        working-directory: ${{ github.workspace }}/${{ needs.get_package_info.outputs.package-basepath }}
      - name: Verify distribution packages
        run: |
          test -n "$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$(find dist -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          ls -l dist
        working-directory: ${{ github.workspace }}/${{ needs.get_package_info.outputs.package-basepath }}  
      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ needs.get_publish_info.outputs.package-name }}-distribution-packages
          path: ${{ github.workspace }}/${{ needs.get_package_info.outputs.package-basepath == '.' && 'dist/*' || format('{0}/dist/*', needs.get_package_info.outputs.package-basepath) }}
  publish_to_pypi:
    name: Publish ${{ needs.get_publish_info.outputs.package-name }}
    if: ${{ github.event_name == 'release' || inputs.environment != 'none' }}
    runs-on: ubuntu-latest
    needs: [get_publish_info, get_package_info, build_package]
    environment:
      name: ${{ case(github.event_name == 'release', 'pypi', inputs.environment) }}
      url: ${{ fromJson(env.environment-info)[env.environment].base-url }}/p/${{ needs.get_publish_info.outputs.package-name }}
    permissions:
      id-token: write
    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ needs.get_publish_info.outputs.package-name }}-distribution-packages
        path: ${{ github.workspace }}/${{ needs.get_package_info.outputs.package-basepath }}/dist/
    - name: Display distribution packages
      run: ls -lR dist/
      working-directory: ${{ github.workspace }}/${{ needs.get_package_info.outputs.package-basepath }}
    - name: Upload to ${{ env.environment }}
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
      with:
        repository-url: ${{ fromJson(env.environment-info)[env.environment].upload-url }}
        packages-dir: ${{ github.workspace }}/${{ needs.get_package_info.outputs.package-basepath }}/dist/
  update_version:
    name: Update ${{ needs.get_publish_info.outputs.package-name }} version
    if: ${{ github.event_name == 'release' || inputs.package-name != 'none' }}
    runs-on: ubuntu-latest
    needs: [get_publish_info, get_package_info, build_package]
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: ni/python-actions/setup-python@edaf1454897cb4cd5f6fc0757cb62dee455e57fd # v0.10.1
      - name: Set up Poetry
        uses: ni/python-actions/setup-poetry@edaf1454897cb4cd5f6fc0757cb62dee455e57fd # v0.10.1
      - name: Update project version
        uses: ni/python-actions/update-project-version@edaf1454897cb4cd5f6fc0757cb62dee455e57fd # v0.10.1
        with:
          project-directory: ${{ github.workspace }}/${{ needs.get_package_info.outputs.package-basepath }}
          branch-prefix: users/build/${{ needs.get_publish_info.outputs.package-name }}-