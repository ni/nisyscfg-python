# .readthedocs.yaml configuration file for Read the Docs

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.11"
  jobs:
    post_create_environment:
      - python -m pip install poetry==2.1.4
    post_install:
      - VIRTUAL_ENV=$READTHEDOCS_VIRTUALENV_PATH poetry install --only main,docs --no-interaction

sphinx:
  configuration: docs/conf.py